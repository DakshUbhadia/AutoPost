[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopost"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
toolchain-probe = [
  "peft==0.21.2",
  "torch==2.6.0",
  "transformers==5.20.1",
  "trl==1.17.1",
]

[project.scripts]
autopost = "autopost.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autopost.store" = ["schema.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["slow: longer synthetic validation", "gpu: requires a CUDA GPU"]
