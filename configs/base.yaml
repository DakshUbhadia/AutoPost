# Revision 3 experiment semantics. Profiles resolve relative to this file.
schema_version: 1
profiles:
  model: models/qwen3_0p6b.yaml
  execution: execution/dev-qwen06b-local24g.yaml
  data: data/math.yaml
templates:
  T_train:
    role: train
    answer_marker: boxed
    user_format: '{problem}


      Please reason step by step, and put your final answer within \boxed{}.'
  E1_answer_line:
    role: eval
    answer_marker: answer_line
    user_format: 'Solve the following problem. End your response with a final line
      of the form ''Answer: <answer>''.


      {problem}'
  E2_plain:
    role: eval
    answer_marker: final_answer_phrase
    user_format: '{problem}


      Show your work, then state the final answer as ''The final answer is <answer>.'''
  E3_terse:
    role: eval
    answer_marker: answer_line
    user_format: 'Problem: {problem}

      Give a brief solution and finish with ''Answer: <answer>''.'
  E4_boxed_reworded:
    role: eval
    answer_marker: boxed
    user_format: 'Here is a math question.

      {problem}

      Work it out and write the result in \boxed{}.'
curriculum:
  group_size: 8
  min_signal_prob: 0.5
  estimate_k: 8
  edge_margin: 0.05
  quotas:
    by:
    - source_id
    - skill
    max_share: 0.5
    low_entropy_max_share: 0.1
  cluster_exposure_cap: 4
  quarantine:
    consensus_share: 0.6
    min_estimates: 2
    action: flag
    exclusion_requires: independent_verification
  audit_flag_persistent_inband_promotions: 3
reward:
  type: binary
  overlong_window: 0
  overlong_max_penalty: 0.0
train:
  learning_rate: 2.0e-05
  warmup_steps: 10
  prompts_per_step: 16
  checkpoint_every_steps: 50
  trl:
    num_generations: 8
    num_iterations: 1
    loss_type: dapo
    scale_rewards: false
    epsilon: 0.2
    epsilon_high: 0.28
    beta: 0.0
    mask_truncated_completions: false
eval:
  k:
    screen: null
    gate: null
    transfer_guard: null
    battery: null
    hidden: null
  k_ref_multiplier: 2
  gate_b_fresh_reference: true
  bootstrap:
    unit: cluster
    n_boot: 4000
  store_raw_completions: true
gate:
  primary:
    metric: content_accuracy
    templates: eval_rotation
    alpha_a: 0.05
    alpha_b: 0.05
  guardrails:
  - name: transfer
    margin: null
    alpha: 0.05
  - name: instruction_following
    margin: null
    alpha: 0.05
  - name: multilingual_math
    margin: null
    alpha: 0.05
  - name: format_compliance
    margin: null
    alpha: 0.05
  target_joint_power: 0.8
  floor: null
controller:
  gate_every_steps: null
  step_budget: null
  max_consecutive_restores: 3
  milestone_every_promotions: 2
  read_budgets:
    gate_a: null
    gate_b: null
    hidden_audit: null
    hidden_sealed: 1
    transfer_sealed: 1
  human_change_budget: null
  expected_false_halts_per_run: 1.0
tripwires:
  checker_disagreement:
    alpha: null
  capability_trend:
    alpha: null
  drift_limits:
    kl_to_base_max: null
    entropy_min: null
    len_p95_max_frac_of_cap: null
  sync_failure:
    gap_multiple_of_running_median: 100
  pool_inband_min_frac: null
  audit_contradiction:
    rule: upper bound of (champion - base) on hidden_audit < 0
persistence:
  metadata_backend: sqlite
  artifact_backend: local
  job_executor: local-subprocess
  keep_rejected_weights: 5
