name: cpu-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements/cpu-dev.lock
      - name: Install pinned CPU environment
        run: |
          python -m pip install --requirement requirements/cpu-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run CPU-safe tests
        run: python -m pytest -q -m "not slow" --basetemp=.test-tmp
      - name: Run quick synthetic self-check
        run: python scripts/selfcheck.py --quick
